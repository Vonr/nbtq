[package]
name = "nbtq-cli"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "nbtq"

[dependencies]
nbtq = { path = "../nbtq", features = ["colours"] }
jaq-core = "3"
jaq-std = "3"
fastnbt = "2"
fastsnbt = "0.2.1"
flate2 = "1.1.9"
anyhow = "1.0.102"
valence_nbt = { version = "0.8.0", features = ["binary", "snbt"] }
